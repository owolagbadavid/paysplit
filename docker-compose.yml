name: paysplit

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paysplit
    ports: ['127.0.0.1:5544:5432']
    volumes:
      - db:/var/lib/postgresql/data
      - ./infra/db-init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d paysplit']
      interval: 2s
      retries: 30

  # The same auth server Supabase hosts, so local development exercises the real provider.
  auth:
    image: supabase/gotrue:v2.198.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:auth-local@db:5432/paysplit?search_path=auth
      GOTRUE_JWT_SECRET: local-only-jwt-secret-with-at-least-32-characters
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_OTP_EXP: 3600
      GOTRUE_PASSWORD_MIN_LENGTH: 10
      GOTRUE_DISABLE_SIGNUP: 'false'
    ports: ['127.0.0.1:9999:9999']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9999/health || exit 1']
      interval: 3s
      retries: 30

  mail:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:1026:1025', '127.0.0.1:8026:8025']

volumes:
  db:
